# Same origin for the website, the admin and the API.
server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  # Docker can assign a new IP when Compose recreates an upstream container.
  # Resolve service names at request time instead of pinning the startup IP.
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 2s;
  set $api_upstream api:3001;
  set $web_upstream web:3000;

  # Media files are served by the API so private assets stay behind permissions.
  location /media/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI content plus up to three parallel image generations can take ~240s.
    # Keep the browser request alive long enough to receive the partial-safe draft.
    proxy_read_timeout 270s;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
